<script id="arco-opening-script">
'use strict';
/** Silent, one-second brand entrance (800 ms reveal + 200 ms fade).
 * Independent of audio, network readiness, lessons and stored progress.
 * Reduced motion, returning from history, or skipping bypasses the entrance.
 */
window.ArcoSplash=(()=>{
 const dialog=document.getElementById('arco-splash');
 const DURATION=1000,FADE=200;
 const TEXT={
  'zh-TW':{subtitle:'\u6a02\u7406\u7df4\u7fd2\u5ba4',loading:'\u6b63\u5728\u6e96\u5099\u7df4\u7fd2\u5ba4\u2026',skip:'\u7565\u904e'},
  en:{subtitle:'Music theory studio',loading:'Opening the studio\u2026',skip:'Skip'},
  de:{subtitle:'Musiktheorie-Studio',loading:'Das Studio wird ge\u00f6ffnet\u2026',skip:'\u00dcberspringen'}
 };
 let locale='zh-TW',motion=true;
 try{locale=window.ArcoStorage.getItem('arco.locale.v1')||locale;motion=JSON.parse(window.ArcoStorage.getItem('arco.visual.preferences.v1'))?.motion!==false;}catch(_){}
 const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 const historyReturn=performance.getEntriesByType?.('navigation')[0]?.type==='back_forward';
 let active=false,closing=false,shown=false,finished=false;
 let holdTimer=0,hardTimer=0,exitTimer=0,returnFocus=null;
 let shownAt=null,finishedAt=null;
 let resolveReady;const ready=new Promise(resolve=>{resolveReady=resolve;});
 const lang=()=>TEXT[window.ArcoI18n?.locale||locale]||TEXT['zh-TW'];
 function sync(){
  const l=lang();
  for(const [id,key] of [['boot-subtitle','subtitle'],['boot-status','loading'],['boot-skip','skip']]){
   const el=document.getElementById(id);if(el&&el.textContent!==l[key])el.textContent=l[key];
  }
 }
 function remove(){
  if(finished)return;
  finished=true;finishedAt=performance.now();
  clearTimeout(exitTimer);clearTimeout(holdTimer);clearTimeout(hardTimer);
  if(dialog){try{if(dialog.open&&typeof dialog.close==='function')dialog.close();}catch(_){}dialog.remove();}
  active=false;closing=false;document.documentElement.removeAttribute('data-arco-opening');
  resolveReady();document.dispatchEvent(new Event('arco:splash-finished'));
  if(returnFocus?.isConnected&&returnFocus!==document.body&&!document.querySelector('dialog[open]'))returnFocus.focus({preventScroll:true});
 }
 function finish(reason='complete'){
  if(finished)return;
  if(!active||reason!=='complete'||reduced.matches){remove();return;}
  if(closing)return;
  closing=true;clearTimeout(holdTimer);
  const remaining=Math.max(0,DURATION-(performance.now()-shownAt));
  const fade=Math.min(FADE,remaining);
  if(!fade){remove();return;}
  dialog.style.setProperty('--arco-splash-exit',fade+'ms');
  dialog.classList.add('boot-leaving');exitTimer=setTimeout(remove,fade);
 }
 function consume(e){e.preventDefault();e.stopImmediatePropagation();}
 // Only consume inputs on the entrance. No audio is created or requested here.
 dialog?.addEventListener('click',e=>{
  if(!e.isTrusted||!active)return;
  consume(e);finish(e.target.closest('#boot-skip')?'skip':'complete');
 });
 dialog?.addEventListener('keydown',e=>{
  if(e.isTrusted&&!e.repeat&&['Enter',' '].includes(e.key)){
   consume(e);finish('skip');
  }
 });
 dialog?.addEventListener('cancel',e=>{e.preventDefault();finish('skip');});
 document.addEventListener('arco:localized',sync);
 document.addEventListener('change',e=>{if(e.target.id==='visual-motion'&&!e.target.checked)finish('motion');});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)finish('hidden');});
 window.addEventListener('pagehide',()=>finish('history'));
 window.addEventListener('pageshow',e=>{if(e.persisted)finish('history');});
 window.ArcoStorage.addEventListener('storage',e=>{
  if(e.key==='arco.visual.preferences.v1'){
   try{if(JSON.parse(e.newValue)?.motion===false)finish('motion');}catch(_){}
  }
 });
 reduced.addEventListener?.('change',e=>{if(e.matches)finish('motion');});
 if(dialog&&motion&&!reduced.matches&&!historyReturn&&!document.hidden){
  sync();active=true;shown=true;returnFocus=document.activeElement;
  document.documentElement.setAttribute('data-arco-opening','true');
  try{dialog.showModal();dialog.tabIndex=-1;dialog.focus({preventScroll:true});}catch(_){dialog.setAttribute('open','');}
  shownAt=performance.now();
  holdTimer=setTimeout(()=>finish('complete'),DURATION-FADE);
  // End after one second; never wait for a picture, a recording, or DOM readiness.
  hardTimer=setTimeout(remove,DURATION);
 }else{remove();}
 return {ready,get active(){return active;},finish,
  snapshot:()=>({active,closing,shown,finished,durationMs:DURATION,shownAt,finishedAt})};
})();
</script>
