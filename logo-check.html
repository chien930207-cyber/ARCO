<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ARCO | Logo check</title><link rel="icon" href="./icons/arco-gold-32-r3.png" type="image/png"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f7f5ee;font:16px/1.7 system-ui,sans-serif}main{max-width:930px;margin:auto;padding:40px 22px}header{display:flex;align-items:center;gap:20px;margin-bottom:30px}header img{width:76px;height:76px;border-radius:18px}h1{margin:0;font-size:26px}p{color:#bec7d1;margin:8px 0 20px}a{color:#e8c78e}button{font:inherit;color:#0b1020;background:#d4af7c;border:0;border-radius:8px;padding:12px 22px;cursor:pointer;min-height:46px}button:focus-visible,a:focus-visible{outline:3px solid #f3d199;outline-offset:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.tile{background:#142030;padding:20px;border:1px solid #334050;border-radius:12px;min-width:0}.tile img{width:100%;max-width:160px;aspect-ratio:1;object-fit:contain;display:block;margin:0 auto 14px}.tile .circle{border-radius:50%}.tile h2{font-size:16px;margin:0}.tile small{color:#bcc5d1}#checks{padding:20px 0}#checks p{padding:10px 15px;border-bottom:1px solid #334050;margin:0;overflow-wrap:anywhere}.ok{color:#94d3ac!important}.bad{color:#f2aeaa!important}.note{font-size:14px;margin-top:22px}code{word-break:break-all}@media(max-width:600px){.grid{grid-template-columns:1fr}.tile{display:grid;grid-template-columns:90px 1fr;gap:0 18px;align-items:center}.tile img{width:90px;grid-row:1/3;margin:0}.tile small{grid-column:2}header{gap:12px}header img{width:60px;height:60px}h1{font-size:23px}}
</style></head><body><main><header><img src="./icons/arco-gold-192-r3.png" alt="ARCO"><div><h1>ARCO 圖示檢查</h1><a href="./index.html">回到網站</a></div></header><p>這頁檢查正式首頁的圖示引用與檔案。不會讀取或清除你的學習進度。</p><div class="grid"><section class="tile"><img src="./icons/arco-gold-512-r3.png" alt="ARCO app icon"><h2>一般 App 圖示</h2><small>512 × 512 PNG</small></section><section class="tile"><img src="./icons/arco-gold-180-r3.png" alt="ARCO Apple touch icon"><h2>iPhone / iPad</h2><small>180 × 180 PNG</small></section><section class="tile"><img class="circle" src="./icons/arco-gold-maskable-512-r3.png" alt="ARCO circle mask preview"><h2>Android 裁切預覽</h2><small>Maskable · 圓形示意</small></section></div><div id="checks" aria-live="polite"></div><button type="button" id="check">檢查首頁與圖示</button><p class="note">請在已上架的網址開啟這頁。檢查通過代表檔案與引用正常，不代表既有桌面捷徑已經更新圖示。若舊捷徑未更新，先匯出進度，再重新加入主畫面測試。</p></main><script>
'use strict';
const out=document.getElementById('checks'),btn=document.getElementById('check');
function show(ok,text){const p=document.createElement('p');p.className=ok?'ok':'bad';p.textContent=(ok?'PASS  ':'CHECK  ')+text;out.append(p);}
async function get(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(r.status+' '+new URL(url,document.baseURI).pathname);return r;}
async function image(url,size){const r=await get(url);const b=await r.blob();const objectURL=URL.createObjectURL(b);try{const im=new Image();im.src=objectURL;await im.decode();if(size&&im.naturalWidth!==size)throw new Error('Image size: '+im.naturalWidth+' / '+size);return im.naturalWidth;}finally{URL.revokeObjectURL(objectURL);}}
btn.addEventListener('click',async()=>{out.replaceChildren();btn.disabled=true;let ok=true;try{
 if(location.protocol==='file:')throw new Error('Please open this check page on your published website.');
 const pageURL=new URL('./index.html',document.baseURI);const source=await(await get(pageURL)).text();const doc=new DOMParser().parseFromString(source,'text/html');
 if(doc.querySelector('meta[name="arco-icon-release"]')?.content!=='gold-r3')throw new Error('The homepage is not the gold-r3 package. Upload index.html too.');show(true,'index.html / gold-r3');
 const icons=[...doc.querySelectorAll('link[rel~="icon"],link[rel="apple-touch-icon"]')];if(icons.length<3)throw new Error('Missing icon links');
 for(const el of icons){const href=el.getAttribute('href');if(!href||href.startsWith('data:')||!href.includes('-r3'))throw new Error('Old icon reference: '+href);const u=new URL(href,pageURL);if(u.origin!==pageURL.origin)throw new Error('Unexpected icon origin');if(u.pathname.endsWith('.ico')){await get(u);}else{await image(u,parseInt(el.getAttribute('sizes')||'0',10)||0);}show(true,u.pathname);}
 const link=doc.querySelector('link[rel="manifest"]');if(!link)throw new Error('Manifest link is missing');const mu=new URL(link.getAttribute('href'),pageURL);const m=await(await get(mu)).json();if(m.name!=='ARCO')throw new Error('Incorrect application name');if(!m.icons?.some(i=>i.purpose==='maskable'))throw new Error('Maskable icon missing');
 for(const it of m.icons){if(!it.src.includes('-r3'))throw new Error('Manifest still uses an old icon URL');const u=new URL(it.src,mu);await image(u,parseInt(it.sizes,10));show(true,it.purpose+' / '+it.sizes);}
 show(true,'ARCO / '+new URL(m.start_url,mu).pathname);
 }catch(e){ok=false;show(false,e.message);}finally{btn.disabled=false;out.dataset.result=ok?'pass':'fail';}});
</script></body></html>
